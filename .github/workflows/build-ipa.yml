name: Build Nano IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode found, using default"
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Nano.xcodeproj \
            -scheme Nano \
            -configuration Release \
            -archivePath build/Nano.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -allowProvisioningUpdates \
            -quiet

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Nano.xcarchive/Products/Applications/Nano.app build/Payload/
          cd build
          zip -r Nano.ipa Payload/
          rm -rf Payload

      - name: Upload IPA Artifact (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: Nano-IPA
          path: build/Nano.ipa
          retention-days: 90

      - name: Publish Direct IPA Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Nano - Dernière version"
          body: "Dernière version compilée de Nano. Téléchargement direct du fichier `.ipa` sans archive ZIP."
          files: build/Nano.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update LiveContainer Source & Bump Version
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PYEOF'
          import json, re, subprocess, datetime

          proj = open("project.yml").read()
          match = re.search(r'MARKETING_VERSION:\s*"(\d+)\.(\d+)\.(\d+)"', proj)
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch}"

          size = subprocess.run(["stat", "-f%z", "build/Nano.ipa"], capture_output=True, text=True).stdout.strip()

          source = {
              "name": "Nano Source",
              "identifier": "com.nano.app.source",
              "sourceURL": "https://raw.githubusercontent.com/Leboxis/Nano/main/apps.json",
              "apps": [
                  {
                      "name": "Nano",
                      "bundleIdentifier": "com.nano.app",
                      "version": version,
                      "versionDate": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "downloadURL": "https://github.com/Leboxis/Nano/releases/latest/download/Nano.ipa",
                      "size": int(size)
                  }
              ]
          }

          with open("apps.json", "w") as f:
              json.dump(source, f, indent=2)
              f.write("\n")

          bumped = proj[:match.start()] + f'MARKETING_VERSION: "{major}.{minor}.{patch + 1}"' + proj[match.end():]
          open("project.yml", "w").write(bumped)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json project.yml
          git diff --cached --quiet || git commit -m "chore: update LiveContainer source & bump version [skip ci]"
          git push

